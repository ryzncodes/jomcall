name: Uptime

# Checks the hosted site and the hosted server from outside every 10 minutes.
# The server's own check (infra/hosted/monitor.sh) cannot email when the whole
# server is down; this run fails instead, and GitHub emails the failure to
# whoever last changed this schedule. GitHub may start a scheduled run late.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Web app answers
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 -o /dev/null https://staging.jomcall.com/
      - name: Voice server answers
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 -o /dev/null https://livekit.staging.jomcall.com/
